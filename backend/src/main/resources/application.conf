ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
    }
    application {
        modules = [ com.example.groceryapp.ApplicationKt.module ]
    }
}

jwt {
    # JWT secret must be provided via JWT_SECRET environment variable
    secret = ${?JWT_SECRET}
    issuer = "http://localhost:8080"
    issuer = ${?JWT_ISSUER}
    audience = "http://localhost:8080/grocery"
    audience = ${?JWT_AUDIENCE}
    realm = "Access to 'grocery'"
}

mongodb {
    # MongoDB connection URI must be provided via MONGODB_URI environment variable
    uri = ${?MONGODB_URI}
    database = "grocery_db"
    database = ${?MONGODB_DATABASE}
}

firebase {
    serviceAccountPath = "firebase-service-account.json"
    serviceAccountPath = ${?FIREBASE_SERVICE_ACCOUNT_PATH}
}
